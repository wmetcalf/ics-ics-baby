[[gaps]]
id = "wrapper-not-built"
description = "The blastbox engine wrapper and its payload builder are a separate follow-on; this contract is the target it must satisfy. Only the artifact paths and finding codes are produced by the CLI today."

[[gaps]]
id = "owa-emulation-unverified"
description = "The OWA body sanitizer models known Outlook-on-the-web behaviour but no rule has been measured against real OWA yet (internal/clientview/testdata/owa-probes/README.md). The view is an approximation; the sidecar says emulation: true."

[[gaps]]
id = "owa-first-event-only"
description = "With several VEVENTs the OWA view renders the first and lists the others' summaries in other_events; their bodies, join URLs and remote refs are not rendered."

[[gaps]]
id = "finding-severity-first-pass"
description = "Finding severities are a first pass by the builder; codes are stable but severities may be retuned."

[[gaps]]
id = "attachment-count"
description = "Attachment extraction is bounded per component (1000) and per file size (--max-attachment-bytes), not per calendar; a hostile calendar can declare many attachment-* artifacts. The worker's Limits must bound it."

[[gaps]]
id = "remote-refs-not-fetched"
description = "Remote images, CSS url(), links and join URLs are recorded as values only (never fetched); link-following belongs to Loadout's email-render and browser engines."

[[gaps]]
id = "no-calendar-conversion"
description = "MSG/TNEF/vCalendar 1.0 inputs are not converted to ICS here (Loadout email-convert follow-on); vcs input parses only as far as the iCalendar parser accepts it."

[[consumers]]
name = "loadout"
engine = "ics-ics-baby"
mapper = "backend/loadout/icsbaby.py:map_outputs"
emits = ["file", "screenshot", "url", "detection"]
