# Engine output contract for `ics-ics-baby` (schema blastbox-engine-contract/1).
#
# ics-ics-baby is a standalone CLI; this file describes what the OPTIONAL blastbox engine
# wrapper (planned beside email-render in msg-mbox-to-eml/src/mail_engines/, engine name
# `ics-ics-baby`) declares when it runs this binary as
#   ics-ics-baby --screenshot-engine chromium --invite-view owa --findings-json \
#     --max-attachments 1000 --out OUTDIR INPUT
# offline and never with --download-attachments. The wrapper does not exist yet (gap
# wrapper-not-built); the artifact paths and finding codes below are what the CLI writes TODAY.
# Spec: docs/superpowers/specs/2026-11-17-chromium-owa-invite-view-design.md
# Validate: python -m blastbox.contract.engine_contract validate blastbox-engine.toml
schema = "blastbox-engine-contract/1"

[engine]
name = "ics-ics-baby"
# detect() accepts input starting (after BOM/whitespace) with BEGIN:VCALENDAR or BEGIN:VCARD.
formats = ["ics", "ifb", "vcs"]
# Rendering is fully offline: Chromium runs with JS off, every request but the HTML file failed,
# a dead proxy and NOTFOUND host resolution. Any other network policy is a misconfiguration.
network = ["none"]
max_input_bytes = 26214400
statuses = ["ok", "rejected", "engine_error"]

[[artifacts]]
id = "ics-manifest"
path = "ics-ics-baby-manifest.json"
kind = "file"
required = true
role = "manifest"
description = "Parsed calendar: events, attendees, attachments, discovered_urls, autoprocessing_signals (free-text suspicious/informational patterns)."

[[artifacts]]
id = "ics-findings"
path = "ics-ics-baby-findings.json"
kind = "file"
required = true
role = "findings"
description = "--findings-json: {schema_version: ics-ics-baby-findings/1, input_sha256, findings[{code, severity, event_uid, message, evidence}]}. Codes are listed under [[detections]]."

[[artifacts]]
id = "preview-html"
path = "ics-ics-baby-preview.html"
kind = "file"
required = true
role = "analyst_preview_html"
description = "ics-ics-baby's analyst card over sanitized content (not what the recipient saw)."

[[artifacts]]
id = "preview-png"
path = "ics-ics-baby-preview.png"
kind = "image"
required = true
role = "analyst_preview_png"
description = "preview-html rasterized by headless Chromium (--screenshot-engine chromium), capture height capped at 20000 px. Loadout computes phash/colorhash at ingress; the engine hashes nothing."

[[artifacts]]
id = "owa-html"
path = "ics-ics-baby-owa.html"
kind = "file"
role = "client_view_html"
description = "Unbranded emulation of the Outlook-on-the-web meeting request (labeled as an emulation, CSP default-src 'none'). The CLI also writes it when the view is skipped (a page stating the reason); the spec lets the wrapper leave it undeclared then."

[[artifacts]]
id = "owa-sidecar"
path = "ics-ics-baby-owa.json"
kind = "file"
required = true
role = "client_view_sidecar"
description = "{profile: owa, emulation: true, status: ok|skipped|render_failed, reason, error, input_sha256, event_uid, other_events, other_event_details[{event_uid, summary, join_url, remote_refs, links, dropped}] (evidence of the events OWA does not render), join_url, remote_refs[{kind: remote|local|cid|inline_data, value, host, path, sha256, mime}], links[{href, host, text}], dropped[], blocked_requests[]}."

[[artifacts]]
id = "owa-png"
path = "ics-ics-baby-owa.png"
kind = "image"
role = "client_view_png"
description = "owa-html rasterized by headless Chromium. Absent when the view is skipped (REPLY/COUNTER/... or no VEVENT) or the render failed."

[[artifacts]]
id = "attachment-*"
path = "ics-ics-baby-attachments/*"
kind = "file"
max_count = 1000
role = "attachment"
description = "Inline (base64) ATTACH payloads extracted by the parser. URL attachments are never fetched. --max-attachments 1000 caps saved files per calendar; past the cap the rest stay unsaved and stderr says 'attachment limit reached'."

[[artifacts]]
id = "inline-*"
path = "ics-ics-baby-inline/*"
kind = "image"
max_count = 1000
max_bytes = 2097152
role = "inline_image"
description = "data: images (png/jpeg/gif/webp/bmp) from the raw X-ALT-DESC body, written as <sha256>.<ext>, each at most 2 MiB decoded; listed in the sidecar as remote_refs kind inline_data with path, sha256 and mime."

[payload]
# Record "ics-ics-baby/1" {method, calendar_name, prodid, event_count, coverage, owa_status}
#   Page index=0 role=preview -> preview-png; Page index=1 role=owa -> owa-png
#   Record "event" {uid, summary, organizer, sent_by, dtstart, dtend, location, status, sequence,
#                   attendees, conferences, join_url, discovered_urls, alarms}
#     EmbeddedResource per attachment and per inline data: image
#   Record "findings" -> ArtifactRef ics-findings (top codes inline)
# Event field names match email-render's mail-calendar/1 so Loadout can join the two engines'
# calendar evidence on (input_sha256, uid).
root = "record"
node_types = ["record", "page", "embedded_resource"]
required_root_fields = ["schema_version", "method", "calendar_name", "prodid", "event_count", "coverage", "owa_status"]
schema_version = "ics-ics-baby/1"

