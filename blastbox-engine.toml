[[gaps]]
id = "wrapper-not-built"
description = "OWNER DECISION / separate plan (spec: 'The blastbox engine and Loadout adapter are a separate, optional follow-on'). The wrapper (msg-mbox-to-eml/src/mail_engines/, detect/warmup/detonate) and its typed payload builder do not exist yet; every artifact path, sidecar field and finding code above is produced by the CLI today, the payload section is the target the wrapper must build."

[[gaps]]
id = "owa-emulation-unverified"
description = "OWNER DECISION: needs a Microsoft 365 test mailbox and a manual measurement run (internal/clientview/testdata/owa-probes/README.md). Until then every sanitizer rule is modelled, not measured; the sidecar carries emulation: true and consumers must label the OWA PNG as an emulation."

[[gaps]]
id = "finding-severity-first-pass"
description = "OWNER DECISION: severities in the code table (internal/icsparse/findings.go) are the builder's first pass; codes are stable, severities may be retuned against labelled data. Loadout maps severity -> risk (info 0, low 10, medium 35, high 70) and should key rules on code, not severity."

[[gaps]]
id = "remote-refs-not-fetched"
description = "LOADOUT CONSUMER: by design (spec anti-goal) nothing here is fetched. Loadout's icsbaby.map_outputs should turn these into url artifacts (not fetched) and hand them to its email-render/browser engines for following: owa-sidecar remote_refs[] where kind=remote (value, host), links[].href, join_url, other_event_details[].{join_url, remote_refs[kind=remote].value, links[].href}, and ics-manifest events[].discovered_urls, events[].attachments[].href (URL attachments), events[].conferences[].uri."

[[gaps]]
id = "no-calendar-conversion"
description = "LOADOUT CONSUMER: MSG/TNEF/vCalendar 1.0 inputs must be converted to iCalendar upstream (Loadout email-convert) before routing here. Loadout should route on accept_magic ics plus extensions ics/ifb/vcs and, for MSG/TNEF, run email-convert first and pass the extracted text/calendar part; the engine returns status rejected for input that does not start with BEGIN:VCALENDAR or BEGIN:VCARD."

[[consumers]]
name = "loadout"
engine = "ics-ics-baby"
mapper = "backend/loadout/icsbaby.py:map_outputs"
emits = ["file", "screenshot", "url", "detection"]
